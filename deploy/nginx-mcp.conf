# nginx vhost for mcp.mimobike.com -> mimo-knowledge-mcp on port 3100.
# Matches the existing Mimo convention (TLS terminated at nginx).

server {
    listen 80;
    server_name mcp.mimobike.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mcp.mimobike.com;

    # Use the existing certificate paths on the host:
    ssl_certificate     /etc/letsencrypt/live/mcp.mimobike.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.mimobike.com/privkey.pem;

    # Optional rate limiting (define the zone in nginx.conf http{} block):
    #   limit_req_zone $binary_remote_addr zone=mcp:10m rate=10r/s;
    # then uncomment:
    #   limit_req zone=mcp burst=20 nodelay;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamable HTTP responses may be long-lived SSE streams:
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }
}
